[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=consoleFormatter,fileFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=consoleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=fileFormatter
args=('TelegramBot.txt', 'a', 10485760, 5, 'utf-8')

[formatter_consoleFormatter]
format=⚡ %(asctime)s 🕒 │ %(levelname)-8s 🏷️ │ %(name)-18s 📦 │ %(funcName)s:%(lineno)d 📍 │ %(message)s
datefmt=%d-%m-%Y %H:%M:%S

[formatter_fileFormatter]
format=[%(asctime)s 🕒 | %(levelname)-8s 🏷️ | %(name)s:%(funcName)s:%(lineno)d 📍] %(message)s
datefmt=%Y-%m-%d %H:%M:%S
